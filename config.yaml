# ==============================================================================
# Gesto-Drive Computer Vision Pipeline Configuration
# Edit parameters and YOLOE vocabulary prompts below.
# ==============================================================================

pipeline:
  camera_index: 0                       # Webcam index (e.g., 0) or path to video file (e.g., "test-Vids/gestoChair-CV-trial1.mp4")
  frame_width: 640                      # Frame capture width
  frame_height: 480                     # Frame capture height
  device: "cuda"                        # Compute device: "cuda" or "cpu"
  fps_target: 10.0                      # Target FPS before degradation mode triggers
  spatial_zones: 5                      # Number of horizontal spatial zones (3, 5, or 7)
  payload_sink: "both"                  # "stdout", "file", or "both"
  payload_file: "payloads.jsonl"        # Output JSONL path
  show_cv_window: true                  # Display OpenCV annotated debug window
  show_dashboard: true                  # Write latest_frame.jpg for Streamlit dashboard
  offline: false                        # Run offline without network checks

models:
  # Object Detection & Tracking (Ultralytics YOLOE)
  yoloe_model: "yoloe-11s-seg.pt"       # Open-vocabulary segmentation model
  yolo_model: "yolov8n.pt"              # Legacy COCO fallback model
  yolo_conf_thresh: 0.4                 # Detection confidence threshold
  tracker: "bytetrack.yaml"             # Multi-object tracker
  scene_mode: "outdoor"                 # Active vocabulary scene: "outdoor" or "indoor"

  # Monocular Depth Estimation (MiDaS)
  midas_model: "MiDaS_small"            # MiDaS model variant
  depth_fallback_interval: 6            # Fallback frame interval when no close hazards are present
  depth_hazard_area_thresh: 0.04        # Trigger depth if hazard bbox area > 4% of frame
  depth_agent_area_thresh: 0.08         # Trigger depth if agent bbox area > 8% of frame

  # Optical Character Recognition (EasyOCR)
  ocr_conf_thresh: 0.7                  # Minimum OCR confidence threshold
  ocr_every_n_frames: 10                # Fallback interval (OCR is primarily event-driven)

  # Face Recognition (dlib)
  face_every_n_frames: 5                # Face recognition check interval on person ROIs
  face_tolerance: 0.5                   # Face distance matching threshold (lower is stricter)
  face_db_path: "data/known_faces.pkl"  # Enrolled face encodings database

